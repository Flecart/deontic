# Real run on the target Qwen3.6-35B-A3B MoE with LoRA. Drive via the sbatch
# scripts in scripts/slurm/. Tune batch/accum to the B200 you land on.

model:
  name: Qwen/Qwen3.6-35B-A3B
  auto_class: auto       # falls back to AutoModelForImageTextToText if needed

lora:
  enabled: true
  r: 16
  alpha: 32

generation:
  backend: vllm          # falls back to hf if vllm lacks qwen3_5_moe support
  max_new_tokens: 512
  vllm:
    gpu_memory_utilization: 0.85
    max_model_len: 8192

data:
  source: seed           # switch to "hf" + hf_name to scale up prompts
  max_prompts: 256

constitution:
  n_revisions: 2

train:
  output_dir: outputs/full
  learning_rate: 5.0e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  num_train_epochs: 1
  max_length: 2048
  gradient_checkpointing: true

rl:
  method: dpo            # set to "grpo" to switch the RL algorithm

paths:
  sft_data: outputs/full/sft.jsonl
  pref_data: outputs/full/prefs.jsonl
  sft_model: outputs/full/sl-cai
  rl_model: outputs/full/rl-cai
